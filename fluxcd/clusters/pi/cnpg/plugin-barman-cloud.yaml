---
# Must live in the operator's namespace. Independent of the cnpg HelmRelease (only
# shares its HelmRepository).
# Pinned: charts >=0.6.0 require k8s >=1.29. Needs the SidecarContainers feature gate on 1.28.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  interval: 30m
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.5.0
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: cnpg-system
      interval: 24h
