---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 24h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 5m
  # Default 5m Helm wait timed out on the first install (2025-10) and, with 0 retries,
  # left the release stuck at failed rev 1 / Stalled for a year (CON-15).
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      # Never auto-rollback/uninstall Traefik: every ingress goes through it.
      remediateLastFailure: false
  chart:
    spec:
      chart: traefik
      version: '26.0.0'
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 24h
  valuesFrom:
    - kind: ConfigMap
      name: helm-values
      valuesKey: helm-values.yaml
