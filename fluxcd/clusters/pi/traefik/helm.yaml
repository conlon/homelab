---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 24h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 5m
  # Default 5m Helm wait timed out on the first install (2025-10) and, with 0 retries,
  # left the release stuck at failed rev 1 / Stalled for a year (CON-15).
  timeout: 10m
  install:
    remediation:
      retries: 3
  # Rollback (default strategy) runs between retries and, since retries > 0,
  # remediateLastFailure defaults to true: after the final failure Flux rolls back to
  # the last good revision instead of leaving a failed release in place. To inspect a
  # failed upgrade in place (e.g. CON-27), suspend the HelmRelease during the upgrade.
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: traefik
      version: '26.0.0'
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 24h
  valuesFrom:
    - kind: ConfigMap
      name: helm-values
      valuesKey: helm-values.yaml
