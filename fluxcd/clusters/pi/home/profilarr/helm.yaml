---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: profilarr
  namespace: home
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: "3.7.3"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: home
      interval: 24h
  values:
    controllers:
      main:
        type: statefulset
        containers:
          profilarr:
            image:
              repository: ghcr.io/dictionarry-hub/profilarr
              tag: "2.3.1"
            env:
              PUID: "1000"
              PGID: "1000"
              UMASK: "022"
              TZ: America/Chicago
              # Required behind a reverse proxy, otherwise SvelteKit rejects form POSTs
              ORIGIN: https://profilarr.local.fellowfreak.dev
              # Parser runs as a sidecar in the same pod
              PARSER_HOST: localhost
              PARSER_PORT: "5000"
            resources:
              requests:
                memory: 128Mi
                cpu: 50m
              limits:
                memory: 512Mi
                cpu: 500m
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 6868
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 18
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 6868
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 6868
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
          # Optional: only used for custom format / quality profile testing
          parser:
            image:
              repository: ghcr.io/dictionarry-hub/profilarr-parser
              tag: "2.3.1"
            resources:
              requests:
                memory: 64Mi
                cpu: 10m
              limits:
                memory: 256Mi
                cpu: 250m
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 5000
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3

    service:
      main:
        controller: main
        ports:
          http:
            port: 80
            targetPort: 6868

    persistence:
      config:
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          main:
            profilarr:
              - path: /config
