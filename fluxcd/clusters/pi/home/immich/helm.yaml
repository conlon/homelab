---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: immich
  namespace: home
spec:
  interval: 24h
  url: https://immich-app.github.io/immich-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: home
spec:
  interval: 5m
  chart:
    spec:
      chart: immich
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: home
      interval: 24h
  values:
    # Shared env vars for all Immich components
    controllers:
      main:
        containers:
          main:
            image:
              tag: v2.5.6
            probes:
              liveness:
                spec:
                  timeoutSeconds: 10
                  failureThreshold: 6
            env:
              TZ: "America/Chicago"
              REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
              IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
              DB_HOSTNAME: immich-database-rw
              DB_PORT: "5432"
              DB_DATABASE_NAME: app
              DB_USERNAME: app
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-database-app
                    key: password

    immich:
      persistence:
        library:
          existingClaim: immich-library

    server:
      ingress:
        main:
          enabled: false  # using Traefik IngressRoute

    machine-learning:
      controllers:
        main:
          strategy: Recreate
      persistence:
        cache:
          enabled: true
          size: 10Gi
          type: persistentVolumeClaim
          storageClass: longhorn
          accessMode: ReadWriteOnce

    valkey:
      enabled: true
      # Prefer the amd64 NUCs so the cache doesn't re-pile onto a hot Pi.
      # See project_thermal_outage.
      defaultPodOptions:
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/arch
                      operator: In
                      values: ["amd64"]
              - weight: 50
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: ["n1", "n2"]
      persistence:
        data:
          enabled: true
          size: 1Gi
          type: persistentVolumeClaim
          storageClass: longhorn
          accessMode: ReadWriteOnce
