      sabnzbd:
        controller: sabnzbd
        labels:
          arr: sabnzbd
        ports:
          metrics:
            port: 9707

    # One ServiceMonitor for all exporter Services. The `release` label is what
    # kube-prometheus-stack's serviceMonitorSelector matches on.
    serviceMonitor:
      main:
        enabled: true
        labels:
          release: kube-prometheus-stack
        selector:
          matchLabels:
            app.kubernetes.io/instance: exportarr
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            # exportarr calls the *arr APIs on every scrape; 2m keeps load on the
            # Pis low while staying under Prometheus' 5m staleness window.
            interval: 2m
            scrapeTimeout: 60s
        targetLabels:
          - arr
