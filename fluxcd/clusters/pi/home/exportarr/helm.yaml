    service:
      sonarr:
        controller: sonarr
        labels:
          arr: sonarr
        ports:
          metrics:
            port: 9707
      sonarr-4k:
        controller: sonarr-4k
        labels:
          arr: sonarr-4k
        ports:
          metrics:
            port: 9707
      radarr:
        controller: radarr
        labels:
          arr: radarr
        ports:
          metrics:
            port: 9707
      radarr-4k:
