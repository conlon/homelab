              capabilities:
                drop: ["ALL"]
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 9707
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 9707
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
      radarr:
        containers:
          exportarr:
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.2.0  # v2.3.0 calls /api/v3/wanted/cutoff, absent in Radarr 4.7.5 -> 500
            args: ["radarr"]
            env:
