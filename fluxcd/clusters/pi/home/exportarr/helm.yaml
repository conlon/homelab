---
# Prometheus exporters for the *arr stack (onedr0p/exportarr). One controller per
# instance, each pointing at that app's in-cluster Service, so the apps themselves
# stay untouched (they're still raw StatefulSets). API keys come from
# api-keys-secret.sops.yaml; each Service carries an `arr` label that the
# ServiceMonitor copies onto every series, so dashboards can split by instance.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: exportarr
  namespace: home
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: "3.7.3"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: home
      interval: 24h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

    controllers:
      sonarr:
        containers:
          exportarr:
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.3.0
            args: ["sonarr"]
            env:
              PORT: "9707"
              URL: http://sonarr.home.svc.cluster.local
              API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: exportarr-api-keys
                    key: SONARR_API_KEY
            resources:
              requests:
                memory: 32Mi
                cpu: 10m
              limits:
                memory: 128Mi
                cpu: 200m
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 9707
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 9707
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
      sonarr-4k:
        containers:
          exportarr:
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.3.0
            args: ["sonarr"]
            env:
              PORT: "9707"
              URL: http://sonarr-4k.home.svc.cluster.local
              API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: exportarr-api-keys
                    key: SONARR_4K_API_KEY
            resources:
              requests:
                memory: 32Mi
                cpu: 10m
              limits:
                memory: 128Mi
                cpu: 200m
            securityContext:
              allowPrivilegeEscalation: false
