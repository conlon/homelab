---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - statefulset.yaml
  - service.yaml
  - ingress.yaml

components:
  - ../0-components/health-checks

# SABnzbd post-processing scripts, mounted at /scripts. SAB must be pointed at
# them in sabnzbd.ini (config PVC, not in git) -- see the docstring in
# scripts/validate_video.py for the exact settings.
configMapGenerator:
  - name: sabnzbd-scripts
    namespace: home
    files:
      - scripts/validate_video.py

patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/httpGet/port
        value: 8080
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
        value: 8080
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
        value: 8080
    target:
      kind: StatefulSet
      name: sabnzbd
