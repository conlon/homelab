---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: prometheus
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: prometheus
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: '56.8.2'
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: prometheus
      interval: 24h
  values:
    # k3s bundles controller-manager, scheduler, and proxy into the k3s
    # binary — no separate pods exist to scrape. Node-level alerts
    # (KubeNodeNotReady, KubeNodeUnreachable) cover control-plane failures.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    tolerations:
      - effect: NoSchedule
        key: vm
        operator: "Equal"
        value: "true"
    alertmanager:
      alertmanagerSpec:
        configSecret: alertmanager-discord
    grafana:
      # Infinity queries the Sonarr/Radarr history APIs directly for the
      # "*arr History" dashboard (their own DBs keep years of events, unlike
      # Prometheus' 30d). 2.12.2 is the newest release supporting Grafana 10.3 —
      # 3.x+ needs >=10.4.8; bump alongside the kube-prometheus-stack upgrade.
      # Installed by URL: grafana-cli resolves "<id> <version>" against grafana.com's
      # versions list, which only returns the newest 24 releases, so 2.12.2 is
      # "not found". The direct download is the all-arch package (incl. arm64).
      plugins:
        - https://grafana.com/api/plugins/yesoreyeram-infinity-datasource/versions/2.12.2/download;yesoreyeram-infinity-datasource
      # API keys for the datasources below, referenced as $VAR in provisioning.
      envFromSecret: grafana-arr-api-keys
      additionalDataSources:
        - name: Sonarr history
          uid: infinity-sonarr
          type: yesoreyeram-infinity-datasource
          access: proxy
          editable: false
          jsonData:
            auth_method: apiKey
            apiKeyKey: X-Api-Key
            apiKeyType: header
            allowedHosts:
              - http://sonarr.home.svc.cluster.local
            timeoutInSeconds: 120
          secureJsonData:
            apiKeyValue: $SONARR_API_KEY
        - name: Sonarr 4K history
          uid: infinity-sonarr-4k
          type: yesoreyeram-infinity-datasource
          access: proxy
          editable: false
          jsonData:
            auth_method: apiKey
            apiKeyKey: X-Api-Key
            apiKeyType: header
            allowedHosts:
              - http://sonarr-4k.home.svc.cluster.local
            timeoutInSeconds: 120
          secureJsonData:
            apiKeyValue: $SONARR_4K_API_KEY
        - name: Radarr history
          uid: infinity-radarr
          type: yesoreyeram-infinity-datasource
          access: proxy
          editable: false
          jsonData:
            auth_method: apiKey
            apiKeyKey: X-Api-Key
            apiKeyType: header
            allowedHosts:
              - http://radarr.home.svc.cluster.local
            timeoutInSeconds: 120
          secureJsonData:
            apiKeyValue: $RADARR_API_KEY
        - name: Radarr 4K history
          uid: infinity-radarr-4k
          type: yesoreyeram-infinity-datasource
          access: proxy
          editable: false
          jsonData:
            auth_method: apiKey
            apiKeyKey: X-Api-Key
            apiKeyType: header
            allowedHosts:
              - http://radarr-4k.home.svc.cluster.local
            timeoutInSeconds: 120
          secureJsonData:
            apiKeyValue: $RADARR_4K_API_KEY
        - name: Radarr LE history
          uid: infinity-radarr-le
          type: yesoreyeram-infinity-datasource
          access: proxy
          editable: false
          jsonData:
            auth_method: apiKey
            apiKeyKey: X-Api-Key
            apiKeyType: header
            allowedHosts:
              - http://radarr-le.home.svc.cluster.local
            timeoutInSeconds: 120
          secureJsonData:
            apiKeyValue: $RADARR_LE_API_KEY
    # The node-exporter DaemonSet runs on every k3s node. Mount the host textfile
    # collector dir so the Pi disk-temp-exporter metrics (hdd_temperature_celsius,
    # written by ansible — USB-SAT SSD temps aren't visible via hwmon) are picked
    # up on its existing scrape. The hostPath is harmlessly empty on non-Pi nodes.
    prometheus-node-exporter:
      extraArgs:
        - --collector.textfile.directory=/host/textfile
      extraHostVolumeMounts:
        - name: textfile
          hostPath: /var/lib/node_exporter/textfile_collector
          mountPath: /host/textfile
          readOnly: true
    prometheus:
      prometheusSpec:
        # Keep the TSDB (heavy, constant writes + compactions) off the thermally
        # fragile Pi USB-SSDs: strongly prefer the amd64 NUCs (n1/n2 have cooling +
        # RAM headroom), falling back to other amd64 nodes, and only a Pi as a last
        # resort. Soft so scheduling never hard-fails. See project_thermal_outage.
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: kubernetes.io/arch
                      operator: In
                      values: ["amd64"]
              - weight: 50
                preference:
                  matchExpressions:
                    - key: kubernetes.io/hostname
                      operator: In
                      values: ["n1", "n2"]
        # Persist the TSDB on Longhorn (3 replicas via the longhorn storageclass)
        # so history survives pod restarts and node loss — it was emptyDir before,
        # so every reschedule wiped all history. Pinned to `longhorn` explicitly
        # because both local-path and longhorn are currently marked (default).
        retention: 30d
        retentionSize: "25GB"
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 30Gi
        additionalScrapeConfigs:
          - job_name: prox0-node
            static_configs:
              - targets:
                  - 192.168.86.4:9100
                labels:
                  instance: prox0
                  host: prox0
          # prox1 hosts the n0-n2 VM k3s nodes. node-exporter (installed via
          # ansible) exposes its CPU coretemp and NVMe temp through node_hwmon_temp_celsius.
          - job_name: prox1-node
            static_configs:
              - targets:
                  - 192.168.86.6:9100
                labels:
                  instance: prox1
                  host: prox1
