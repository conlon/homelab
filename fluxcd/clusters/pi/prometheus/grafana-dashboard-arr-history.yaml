---
# *arr history dashboard: initial downloads vs upgrades over any time range, read
# straight from each Sonarr/Radarr instance's history API via the Infinity
# datasources provisioned in helm.yaml (grafana.additionalDataSources). Unlike
# grafana-dashboard-arr.yaml it isn't bounded by Prometheus retention.
# Generated layout; JSONata in root_selector runs in Infinity's backend (jsonata-go):
# keep group-by keys simple and avoid blocks inside lambdas — both misbehave there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-arr-history
  namespace: prometheus
  labels:
    grafana_dashboard: "1"
data:
  arr-history.json: |
    {
      "annotations": {
        "list": []
      },
      "title": "*arr History",
      "uid": "arr-history",
      "description": "Initial downloads vs upgrades from the Sonarr/Radarr history APIs (Infinity datasource). Reaches back as far as each app's history; queries are heavy, so no auto-refresh.",
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "refresh": "",
      "schemaVersion": 38,
      "tags": [
        "media",
        "arr"
      ],
      "time": {
        "from": "now-1y",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": []
      },
      "timezone": "utc",
      "links": [
        {
          "title": "*arr Activity & Library (Prometheus)",
          "type": "link",
          "url": "/d/arr-activity",
          "icon": "dashboard"
        }
      ],
      "templating": {
        "list": [
          {
            "name": "bucket",
            "label": "Bucket",
            "type": "custom",
            "query": "Week : 604800000, Day : 86400000",
            "current": {
              "text": "Week",
              "value": "604800000"
            },
            "options": [
              {
                "text": "Week",
                "value": "604800000",
                "selected": true
