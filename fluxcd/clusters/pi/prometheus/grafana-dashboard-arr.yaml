---
# *arr activity + library dashboard. Library stats adapted from community dashboards
# 12530 (Sonarr v3) and 12896 (Radarr v3) — switched to native panels (their angular
# piechart no longer renders), filtered by the `arr` label from the exportarr
# ServiceMonitor (home/exportarr), plus time-series activity panels.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-arr
  namespace: prometheus
  labels:
    grafana_dashboard: "1"
data:
  arr-activity.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "*arr stack activity and library state from exportarr. Activity is limited to Prometheus retention (30d).",
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "refresh": "5m",
      "schemaVersion": 38,
      "tags": [
        "media",
        "arr"
      ],
      "templating": {
        "list": [
          {
            "current": {},
            "hide": 0,
            "includeAll": false,
            "name": "datasource",
            "label": "Datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "name": "sonarr",
            "label": "Sonarr",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(sonarr_series_total, arr)",
              "refId": "sonarr"
            },
            "definition": "label_values(sonarr_series_total, arr)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "refresh": 2,
            "sort": 1,
            "hide": 0
          },
          {
            "name": "radarr",
            "label": "Radarr",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": {
              "query": "label_values(radarr_movie_total, arr)",
              "refId": "radarr"
            },
            "definition": "label_values(radarr_movie_total, arr)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "refresh": 2,
            "sort": 1,
            "hide": 0
          }
        ]
      },
      "time": {
        "from": "now-30d",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "*arr Activity & Library",
      "uid": "arr-activity",
      "version": 1,
      "panels": [
        {
          "type": "row",
          "title": "Activity",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "History events per day",
          "description": "Rows added to each app's history per day (grabs, imports, upgrade-deletes, failures). The broadest activity signal exportarr exposes \u2014 it does not split initial downloads from upgrades.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "id": 2,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "increase(sonarr_history_total{arr=~\"$sonarr\"}[1d])",
              "legendFormat": "{{arr}}",
              "refId": "A",
              "interval": "1d"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "increase(radarr_history_total{arr=~\"$radarr\"}[1d])",
              "legendFormat": "{{arr}}",
              "refId": "B",
              "interval": "1d"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "interval": "1d"
        },
        {
          "type": "timeseries",
          "title": "Library growth per day",
          "description": "Net change in downloaded episodes / movies per day. Rises on initial downloads; upgrades replace files so they don't move this.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "id": 3,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "delta(sonarr_episode_downloaded_total{arr=~\"$sonarr\"}[1d])",
              "legendFormat": "{{arr}} episodes",
              "refId": "A",
              "interval": "1d"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "delta(radarr_movie_downloaded_total{arr=~\"$radarr\"}[1d])",
              "legendFormat": "{{arr}} movies",
              "refId": "B",
              "interval": "1d"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "interval": "1d"
        },
        {
          "type": "timeseries",
          "title": "Episodes below quality cutoff (upgrade backlog)",
          "description": "Episodes that have a file but haven't reached their profile's cutoff. A falling line = upgrades landing.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "id": 4,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sonarr_episode_cutoff_unmet_total{arr=~\"$sonarr\"}",
              "legendFormat": "{{arr}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "min",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Missing / wanted",
          "description": "Monitored items with no file yet \u2014 what initial downloads are working through.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "id": 5,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sonarr_episode_missing_total{arr=~\"$sonarr\"}",
              "legendFormat": "{{arr}} episodes",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "radarr_movie_missing_total{arr=~\"$radarr\"}",
              "legendFormat": "{{arr}} movies",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "min",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "Queue",
          "description": "Items currently in each app's download queue, and SABnzbd's own queue.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "id": 6,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 17
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (arr) (sonarr_queue_total{arr=~\"$sonarr\"})",
              "legendFormat": "{{arr}}",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (arr) (radarr_queue_total{arr=~\"$radarr\"})",
              "legendFormat": "{{arr}}",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (arr) (sabnzbd_queue_length)",
              "legendFormat": "{{arr}}",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "min",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "timeseries",
          "title": "SABnzbd downloaded per day",
          "description": "Bytes SABnzbd downloaded per day.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "id": 7,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 17
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "increase(sabnzbd_downloaded_bytes[1d])",
              "legendFormat": "sabnzbd",
              "refId": "A",
              "interval": "1d"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "min": 0,
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "interval": "1d"
        },
        {
          "type": "timeseries",
          "title": "Prowlarr grabs per day by indexer",
          "description": "Releases grabbed through each indexer per day.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "id": 8,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 25
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "increase(prowlarr_indexer_grabs_total[1d])",
              "legendFormat": "{{indexer}}",
              "refId": "A",
              "interval": "1d"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "interval": "1d"
        },
        {
          "type": "timeseries",
          "title": "SABnzbd speed",
          "description": "Current download speed.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "id": 9,
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 25
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sabnzbd_speed_bps",
              "legendFormat": "sabnzbd",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "min",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "type": "row",
          "title": "Library \u2014 Sonarr (from dashboard 12530)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 33
          },
          "id": 10,
          "panels": []
        },
        {
          "type": "stat",
          "title": "Series",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "id": 11,
          "gridPos": {
